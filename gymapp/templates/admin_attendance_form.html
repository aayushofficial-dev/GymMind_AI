{% extends 'base.html' %}

{% block content %}

<div class="container mt-4">

    <h2 class="mb-4">Add Attendance</h2>

    <form method="post">

        {% csrf_token %}

        <div class="row g-3">

            <!-- Member -->
            <div class="col-md-6">
                <label for="member_id" class="form-label">
                    Member
                </label>

                <select
                    name="member_id"
                    id="member_id"
                    class="form-select"
                    required
                >
                    <option value="">Select Member</option>

                    {% for member in members %}
                        <option value="{{ member.id }}">
                            {{ member.full_name }} ({{ member.user.username }})
                        </option>
                    {% endfor %}

                </select>
            </div>

            <!-- Date -->
            <div class="col-md-3">
                <label for="date" class="form-label">
                    Date
                </label>

                <input
                    type="date"
                    name="date"
                    id="date"
                    class="form-control"
                    value="{{ today|date:'Y-m-d' }}"
                    required
                >
            </div>

            <!-- Time In -->
            <div class="col-md-3">
                <label for="time_in" class="form-label">
                    Time In
                </label>

                <input
                    type="time"
                    name="time_in"
                    id="time_in"
                    class="form-control"
                    required
                >
            </div>

        </div>

        <div class="mt-4">

            <button
                type="submit"
                class="btn btn-primary"
            >
                Add Attendance
            </button>

            <a
                href="{% url 'admin_attendance_list' %}"
                class="btn btn-secondary"
            >
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
