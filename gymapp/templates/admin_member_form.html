{% extends 'base.html' %}

{% block content %}

<h2 class="mb-4">
    {% if mode == 'add' %}
        Add Member
    {% else %}
        Edit Member
    {% endif %}
</h2>

<form method="post" class="row g-3 w-75">

    {% csrf_token %}

    {% if mode == 'edit' %}
        <input type="hidden" name="member_id" value="{{ member.id }}">
    {% endif %}

    <div class="col-md-6">
        <label class="form-label">Username *</label>
        <input
            type="text"
            name="username"
            class="form-control"
            value="{{ member.username|default:'' }}"
            required
        >
    </div>

    <div class="col-md-6">
        <label class="form-label">Password *</label>
        <input
            type="password"
            name="password"
            class="form-control"
            {% if mode == 'add' %}required{% endif %}
        >
    </div>

    <div class="col-md-6">
        <label class="form-label">Full Name *</label>
        <input
            type="text"
            name="full_name"
            class="form-control"
            value="{{ member.full_name|default:'' }}"
            required
        >
    </div>

    <div class="col-md-3">
        <label class="form-label">Mobile</label>
        <input
            type="text"
            name="mobile"
            class="form-control"
            value="{{ member.mobile|default:'' }}"
            maxlength="10"
        >
    </div>

   
    <div class="col-md-3">
        <label class="form-label">Age</label>
        <input
            type="number"
            name="age"
            class="form-control"
            value="{{ member.age|default:'' }}"
        >
    </div>

   
    <div class="col-md-3">
        <label class="form-label">Gender</label>
        <select name="gender" class="form-select">
            <option value="">Select</option>
            <option value="Male"
                {% if member.gender == "Male" %}selected{% endif %}>
                Male
            </option>
            <option value="Female"
                {% if member.gender == "Female" %}selected{% endif %}>
                Female
            </option>
            <option value="Other"
                {% if member.gender == "Other" %}selected{% endif %}>
                Other
            </option>
        </select>
    </div>

    
    <div class="col-md-3">
        <label class="form-label">Join Date</label>
        <input
            type="date"
            name="join_date"
            class="form-control"
            value="{{ member.join_date|date:'Y-m-d' }}"
        >
    </div>

   
    <div class="col-md-6">
        <label class="form-label">Address</label>
        <textarea
            name="address"
            class="form-control"
            rows="2"
        >{{ member.address|default:'' }}</textarea>
    </div>

    <div class="col-md-6">
        <label class="form-label">Membership Plan</label>
        <select name="membership_plan" class="form-select">
            <option value="">No Plan</option>

            {% for plan in plans %}
                <option value="{{ plan.id }}"
                    {% if member.membership_plan_id == plan.id %}selected{% endif %}>
                    {{ plan.name }}
                </option>
            {% endfor %}
        </select>
    </div>

    
    <div class="col-md-6">
        <label class="form-label">Trainer</label>
        <select name="trainer" class="form-select">
            <option value="">No Trainer</option>

            {% for trainer in trainers %}
                <option value="{{ trainer.id }}"
                    {% if member.trainer_id == trainer.id %}selected{% endif %}>
                    {{ trainer.name }}
                </option>
            {% endfor %}
        </select>
    </div>


    <div class="col-12 mt-3">
        <button type="submit" class="btn btn-primary">
            {% if mode == 'add' %}
                Save
            {% else %}
                Update Member
            {% endif %}
        </button>

        <a
            href="{% url 'admin_members_list' %}"
            class="btn btn-secondary"
        >
            Cancel
        </a>
    </div>

</form>

{% endblock %}
