{% extends 'base.html' %}

{% block content %}

<h2 class="mb-3">
    {%if mode == 'add'%}
        Add  Member
    {%else%}
        Edit Member
    {%endif%}

</h2>

<form method="post" class="row g-3 w-75">
    {% csrf_token %}
    <div class="col-md-6">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-control">
    </div>
    <div class="col-md-6">
        <label class="form-label">Contact Number</label>
        <input type="text" name="mobile" class="form-control" value="{{member.mobile|default:''}}" maxlength="10">
    </div>
    <div class="col-md-6">
        <label class="form-label">Specialization</label>
        <input type="text" name="specialization" class="form-control" value="{{member.specialization|default:''}}">
    </div>
    <div class="col-md-6">
        <label  class="form-label">Shift Timing</label> 
        <input type="text" name="shift_timing" class="form-control" value="{{member.shift_timing|default:''}}" 
        placeholder="e.g. 6 AM - 10 PM">
    </div>

<div class="col-md-6">
    <button type="submit" class="btn btn-primary">
        {%if mode == 'add'%}
            Add Member
        {%else%}
            Update Member
        {%endif%}
    </button>
<a href="{% url 'admin_members_list' %}" class="btn btn-secondary">Cancel</a>
</div>


    </form>




{% endblock %}
