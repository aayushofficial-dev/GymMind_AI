{% extends 'base.html' %}

{% block content %}

<h2 class="mb-3">
    Add Workout / Diet Plan
</h2> 

<form method="post" class="row g-3 w-75">
    {% csrf_token %}
   <div class="col-md-6">
    <label for="member_id" class="form-label">Members</label>
   <select name="member_id" class="form-select" required>
    <option value="">Select Member</option>
    {% for member in members %}
        <option value="{{ member.id }}">
            {{ member.full_name }} ({{ member.user.username }})
        </option>
    {% endfor %}
   </select>
   </div>

   <div class="col-md-6">
    <label for="date" class="form-label">Title</label>
    <input type="text" class="form-control" required>
   </div>
   
   <div class="col-md-12">
    <label for="time_in" class="form-label">Description</label>
    <textarea class="form-control" rows="5" placeholder="Write workout / diet instructions" required></textarea>
   </div>

   <div class="col-md-12">
    <button type="submit" class="btn btn-primary">
       Save Workout / Diet Plan
    </button>
    <a href="{% url 'admin_workout_plans_list' %}" class="btn btn-secondary">Cancel</a>
   </div>
</form>


<div class="row g-3">
{% for wp in workout_plans %}

<div class="col-md-6">
</div>
<div class="card-shadow-sm">

</div>
<div class="card-header bg-primary text-white d-flex justify-content-between">
<span>{{ wp.title }}</span>
<small>{{ wp.member.full_name }}</small>
</div>
<div class="card-body">
    <p class="small text-muted mb-1">{{ wp.created_at }}</p>
    <p style="white-space: pre-line;">{{ wp.description }}</p>
</div>


{% endfor %}
{% endblock %}
