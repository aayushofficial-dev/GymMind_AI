{% extends 'base.html' %}

{% block content %}

<div class="container-fluid payment-container">

    <h1>Record Payment</h1>

    <form method="POST">
        {% csrf_token %}

        <div class="row g-4">

            <div class="col-md-6">
                <label for="member_id" class="form-label">
                    Member <span class="required">*</span>
                </label>

                <select name="member_id" id="member_id" class="form-select" required>
                    <option value="">Select Member</option>

                    {% for member in members %}
                        <option value="{{ member.id }}">
                            {{ member.full_name }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="col-md-6">
                <label for="plan_id" class="form-label">
                    Plan <span class="required">*</span>
                </label>

                <select name="plan_id" id="plan_id" class="form-select" required>
                    <option value="">Select Plan</option>

                    {% for plan in plans %}
                        <option value="{{ plan.id }}">
                            {{ plan.name }} - {{ plan.duration_months }} months - ₹ {{ plan.fee }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="col-md-3">
                <label for="amount" class="form-label">
                    Amount <span class="required">*</span>
                </label>

                <input
                    type="number"
                    name="amount"
                    id="amount"
                    class="form-control"
                    step="0.01"
                    min="0"
                    required
                >
            </div>

            <div class="col-md-3">
                <label for="payment_date" class="form-label">
                    Payment Date
                </label>

                <input
                    type="date"
                    name="payment_date"
                    id="payment_date"
                    class="form-control"
                >
            </div>

            <div class="col-md-3">
                <label for="mode" class="form-label">
                    Mode
                </label>

                <select name="mode" id="mode" class="form-select">
                    <option value="CASH">Cash</option>
                    <option value="ONLINE">Online</option>
                </select>
            </div>

            <div class="col-md-3">
                <label for="status" class="form-label">
                    Status
                </label>

                <select name="status" id="status" class="form-select">
                    <option value="PAID">Paid</option>
                    <option value="PENDING">Pending</option>
                </select>
            </div>

            <div class="col-12">
                <label for="notes" class="form-label">
                    Notes
                </label>

                <textarea
                    name="notes"
                    id="notes"
                    class="form-control"
                    rows="3"
                ></textarea>
            </div>

            <div class="col-12">

                <div class="membership-box">

                    <div class="form-check membership-check">
                        <input
                            type="checkbox"
                            name="set_membership"
                            id="set_membership"
                            class="form-check-input"
                        >

                        <label
                            for="set_membership"
                            class="form-check-label"
                        >
                            Also update member's membership start/end using this plan
                        </label>
                    </div>

                    <div class="membership-date">

                        <label
                            for="membership_start"
                            class="form-label"
                        >
                            Membership Start Date
                        </label>

                        <input
                            type="date"
                            name="membership_start"
                            id="membership_start"
                            class="form-control"
                        >

                        <div class="form-text">
                            End date will be calculated as start date + plan duration × 30 days (approx).
                        </div>

                    </div>

                </div>

            </div>

        </div>

        <div class="form-buttons">

            <button type="submit" class="btn btn-primary">
                Save Payment
            </button>

            <a
                href="{% url 'admin_payments_list' %}"
                class="btn btn-secondary"
            >
                Cancel
            </a>

        </div>

    </form>

</div>
{% endblock %}
