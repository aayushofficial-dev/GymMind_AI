{% extends 'base.html' %}

{% block content %}

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Edit Equipment</h2>

        <a href="{% url 'admin_equipment_list' %}" class="btn btn-secondary">
            Back to Equipment
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">

            <form method="post">
                {% csrf_token %}

                <div class="mb-3">
                    <label for="name" class="form-label">Equipment Name</label>

                    <input
                        type="text"
                        name="name"
                        id="name"
                        class="form-control"
                        value="{{ equipment.name }}"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="units" class="form-label">Units</label>

                    <input
                        type="number"
                        name="units"
                        id="units"
                        class="form-control"
                        min="1"
                        value="{{ equipment.units }}"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="price" class="form-label">Price</label>

                    <input
                        type="number"
                        name="price"
                        id="price"
                        class="form-control"
                        min="0"
                        step="0.01"
                        value="{{ equipment.price }}"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="purchase_date" class="form-label">
                        Purchase Date
                    </label>

                    <input
                        type="date"
                        name="purchase_date"
                        id="purchase_date"
                        class="form-control"
                        value="{{ equipment.purchase_date|date:'Y-m-d' }}"
                        required
                    >
                </div>

                <div class="mb-3 form-check">
                    <input
                        type="checkbox"
                        name="is_active"
                        id="is_active"
                        class="form-check-input"
                        {% if equipment.is_active %}checked{% endif %}
                    >

                    <label for="is_active" class="form-check-label">
                        Active Equipment
                    </label>
                </div>

                <div class="d-flex gap-2">

                    <button type="submit" class="btn btn-primary">
                        Save Changes
                    </button>

                    <a
                        href="{% url 'admin_equipment_list' %}"
                        class="btn btn-secondary"
                    >
                        Cancel
                    </a>

                </div>

            </form>

        </div>
    </div>

</div>

{% endblock %}
